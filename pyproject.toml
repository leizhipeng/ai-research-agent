[project]
name = "agentic-research-assistant"
version = "0.1.0"
description = "An evidence-grounded scientific research assistant for learning agent engineering."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "mcp>=1.20,<2",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
research-agent = "research_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.13,<1",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
